<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><title>HH Retail Pocket</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#07111f;--card:#101d2e;--card2:#14263b;--txt:#f4f8fc;--muted:#9fb0c3;--cyan:#29d3c2;--orange:#ffb54a;--red:#ff6675;--line:#243a52}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#07111f,#0b1727 50%,#07111f);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:520px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand b{font-size:22px;letter-spacing:.8px}.brand small{display:block;color:var(--muted)}.status{font-size:12px;color:var(--cyan);background:#0d2a2a;padding:7px 10px;border-radius:99px}.screen{display:none}.screen.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:1px solid var(--line);background:linear-gradient(145deg,var(--card2),var(--card));color:var(--txt);border-radius:20px;padding:18px;text-align:left;min-height:130px;box-shadow:0 10px 22px #0004}.tile:active{transform:scale(.98)}.tile .ico{font-size:30px}.tile strong{display:block;font-size:17px;margin-top:12px}.tile span{font-size:12px;color:var(--muted)}h2{margin:8px 0 16px}.back{border:0;background:transparent;color:var(--cyan);font-weight:700;padding:8px 0}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;background:#0a1625;color:var(--txt);font-size:16px}textarea{min-height:90px}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;background:var(--cyan);color:#04221f;font-size:16px;font-weight:800}.btn.alt{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.btn.warn{background:var(--orange);color:#291800}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.price{font-size:54px;font-weight:900;color:var(--cyan);text-align:center;margin:18px 0}.muted{color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}.item:last-child{border:0}.badge{padding:5px 8px;border-radius:9px;background:#21364d;color:var(--muted);font-size:11px}video{width:100%;border-radius:16px;background:#000;max-height:270px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#08111e;padding:12px 18px;border-radius:99px;font-weight:700;display:none;z-index:5}.empty{text-align:center;color:var(--muted);padding:28px 5px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.danger{color:var(--red)}@media print{body{background:#fff;color:#000}.app>*{display:none!important}#printArea{display:block!important}.labelprint{border:2px solid #000;width:70mm;padding:5mm;text-align:center}.labelprint h3{font-size:22px;margin:0}.labelprint .p{font-size:30px;font-weight:900}.labelprint .code{font-family:monospace;letter-spacing:2px}}
</style></head>
<body><main class="app"><header><div class="brand"><b>HH RETAIL</b><small>Android v2.0</small></div><div class="status" id="net">● EN LÍNEA</div></header>
<section id="home" class="screen active"><div class="grid">
<button class="tile" onclick="go('scan')"><span class="ico">▣</span><strong>Escanear</strong><span>Cámara o código manual</span></button>
<button class="tile" onclick="go('prices')"><span class="ico">$</span><strong>Precios</strong><span>Consulta inmediata</span></button>
<button class="tile" onclick="go('inventory')"><span class="ico">▤</span><strong>Inventario</strong><span>Conteo y productos</span></button>
<button class="tile" onclick="go('labels')"><span class="ico">◫</span><strong>Etiquetas</strong><span>Vista e impresión</span></button>
<button class="tile" onclick="go('audit')"><span class="ico">◎</span><strong>Auditoría</strong><span>Foto y observación</span></button>
<button class="tile" onclick="go('tools')"><span class="ico">⚡</span><strong>Herramientas</strong><span>Margen y respaldo</span></button>
</div></section>
<section id="scan" class="screen"><button class="back" onclick="go('home')">‹ Inicio</button><h2>Escanear producto</h2><div class="panel"><div style="position:relative"><video id="video" playsinline autoplay muted></video><div id="scanLine" style="display:none;position:absolute;left:10%;right:10%;top:50%;height:3px;background:#29d3c2;box-shadow:0 0 12px #29d3c2"></div></div><div id="liveStatus" class="hint">Escáner detenido</div><button class="btn" id="scanBtn" onclick="startScan()">Iniciar escaneo inmediato</button><label class="btn alt" style="display:block;text-align:center;cursor:pointer">Tomar foto del código<input id="scanPhoto" type="file" accept="image/*" capture="environment" style="display:none" onchange="scanImage(this.files[0])"></label><button class="btn alt" onclick="stopScan()">Cerrar cámara</button><p class="hint">El escaneo automático depende del navegador. Siempre puedes escribir el código.</p></div><label>Código</label><input id="scanCode" inputmode="numeric" placeholder="EAN, UPC o interno"><button class="btn warn" onclick="lookup('scanCode')">Buscar producto</button><div id="scanResult"></div></section>
<section id="prices" class="screen"><button class="back" onclick="go('home')">‹ Inicio</button><h2>Verificador de precios</h2><label>Código o nombre</label><input id="priceQuery" placeholder="Buscar…"><button class="btn" onclick="priceLookup()">Consultar</button><div id="priceResult" class="panel empty">Esperando consulta</div></section>
<section id="inventory" class="screen"><button class="back" onclick="go('home')">‹ Inicio</button><h2>Inventario</h2><div class="panel"><label>Código</label><input id="pCode" inputmode="numeric"><label>Producto</label><input id="pName"><div class="row"><div><label>Precio</label><input id="pPrice" type="number" step="0.01"></div><div><label>Existencia</label><input id="pStock" type="number" step="1"></div></div><button class="btn" onclick="saveProduct()">Guardar producto</button></div><input id="invSearch" placeholder="Filtrar productos…" oninput="renderProducts()"><div id="productList" class="panel"></div></section>
<section id="labels" class="screen"><button class="back" onclick="go('home')">‹ Inicio</button><h2>Crear etiqueta</h2><label>Código</label><input id="lCode"><button class="btn alt" onclick="fillLabel()">Cargar desde inventario</button><label>Producto</label><input id="lName"><label>Precio</label><input id="lPrice" type="number" step="0.01"><button class="btn" onclick="printLabel()">Vista e imprimir</button></section>
<section id="audit" class="screen"><button class="back" onclick="go('home')">‹ Inicio</button><h2>Auditoría rápida</h2><label>Tipo</label><select id="aType"><option>Precio faltante</option><option>Producto agotado</option><option>Producto mal ubicado</option><option>Otro</option></select><label>Foto</label><input id="aPhoto" type="file" accept="image/*" capture="environment"><label>Observación</label><textarea id="aNote" placeholder="Describe lo encontrado"></textarea><button class="btn" onclick="saveAudit()">Guardar incidencia</button><div id="auditList" class="panel"></div></section>
<section id="tools" class="screen"><button class="back" onclick="go('home')">‹ Inicio</button><h2>Herramientas</h2><div class="panel"><h3>Calculadora comercial</h3><div class="row"><div><label>Costo</label><input id="cost" type="number"></div><div><label>Margen %</label><input id="margin" type="number"></div></div><button class="btn" onclick="calc()">Calcular</button><div id="calcResult" class="price">C$0.00</div></div><div class="panel"><h3>Datos</h3><button class="btn alt" onclick="exportData()">Exportar respaldo</button><label>Importar respaldo</label><input type="file" accept="application/json" onchange="importData(this.files[0])"><button class="btn alt danger" onclick="resetData()">Borrar todos los datos</button></div></section>
<div id="printArea"></div></main><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);let stream=null,scanTimer=null,detector=null,lastCode='',lastAt=0,scanning=false;
const products=()=>JSON.parse(localStorage.hhProducts||'[]');const audits=()=>JSON.parse(localStorage.hhAudits||'[]');
function go(id){if(id!=='scan')stopScan();document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='inventory')renderProducts();if(id==='audit')renderAudits();scrollTo(0,0)}
function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
function money(n){return 'C$'+Number(n||0).toFixed(2)}
function findProduct(q){q=(q||'').trim().toLowerCase();return products().find(p=>p.code.toLowerCase()===q)||products().find(p=>p.name.toLowerCase().includes(q))}
function productCard(p){return `<div class="panel"><b>${esc(p.name)}</b><div class="price">${money(p.price)}</div><div class="muted">Código: ${esc(p.code)} · Existencia: ${p.stock}</div></div>`}
function lookup(id){const p=findProduct($(id).value);$('scanResult').innerHTML=p?productCard(p):'<div class="panel empty">Producto no encontrado</div>';if(p)navigator.vibrate?.(80)}
function priceLookup(){const p=findProduct($('priceQuery').value);$('priceResult').innerHTML=p?`<b>${esc(p.name)}</b><div class="price">${money(p.price)}</div><span class="badge">Existencia ${p.stock}</span>`:'Producto no encontrado'}
function saveProduct(){let ps=products(),code=$('pCode').value.trim(),name=$('pName').value.trim();if(!code||!name)return toast('Completa código y producto');let p={code,name,price:+$('pPrice').value||0,stock:+$('pStock').value||0};let i=ps.findIndex(x=>x.code===code);i>=0?ps[i]=p:ps.unshift(p);localStorage.hhProducts=JSON.stringify(ps);['pCode','pName','pPrice','pStock'].forEach(x=>$(x).value='');renderProducts();toast('Producto guardado')}
function renderProducts(){let q=($('invSearch')?.value||'').toLowerCase(),ps=products().filter(p=>(p.code+' '+p.name).toLowerCase().includes(q));$('productList').innerHTML=ps.length?ps.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.code)} · ${money(p.price)} · Stock ${p.stock}</div></div><button class="badge" onclick="editProduct('${js(p.code)}')">Editar</button></div>`).join(''):'<div class="empty">Aún no hay productos</div>'}
function editProduct(code){const p=findProduct(code);if(!p)return;$('pCode').value=p.code;$('pName').value=p.name;$('pPrice').value=p.price;$('pStock').value=p.stock;scrollTo(0,0)}
function fillLabel(){const p=findProduct($('lCode').value);if(!p)return toast('Producto no encontrado');$('lName').value=p.name;$('lPrice').value=p.price}
function printLabel(){let n=$('lName').value.trim(),c=$('lCode').value.trim();if(!n||!c)return toast('Completa producto y código');$('printArea').innerHTML=`<div class="labelprint"><h3>${esc(n)}</h3><div class="p">${money($('lPrice').value)}</div><div class="code">${esc(c)}</div></div>`;window.print()}
async function saveAudit(){let file=$('aPhoto').files[0],photo='';if(file){photo=await resize(file)}let as=audits();as.unshift({id:Date.now(),type:$('aType').value,note:$('aNote').value.trim(),date:new Date().toLocaleString(),photo});localStorage.hhAudits=JSON.stringify(as);$('aPhoto').value='';$('aNote').value='';renderAudits();toast('Incidencia guardada')}
function renderAudits(){let as=audits();$('auditList').innerHTML=as.length?as.map(a=>`<div class="item"><div><b>${esc(a.type)}</b><div class="muted">${esc(a.date)} · ${esc(a.note||'Sin nota')}</div>${a.photo?`<img src="${a.photo}" style="width:90px;margin-top:8px;border-radius:8px">`:''}</div></div>`).join(''):'<div class="empty">Sin incidencias</div>'}
function resize(file){return new Promise(ok=>{let im=new Image(),r=new FileReader();r.onload=()=>im.src=r.result;im.onload=()=>{let s=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.65))};r.readAsDataURL(file)})}
function calc(){let c=+$('cost').value||0,m=+$('margin').value||0;$('calcResult').textContent=money(m>=100?0:c/(1-m/100))}
function exportData(){let b=new Blob([JSON.stringify({products:products(),audits:audits()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hh-retail-respaldo.json';a.click();URL.revokeObjectURL(a.href)}
function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);localStorage.hhProducts=JSON.stringify(d.products||[]);localStorage.hhAudits=JSON.stringify(d.audits||[]);toast('Respaldo importado')}catch(e){toast('Archivo no válido')}};r.readAsText(f)}
function resetData(){if(confirm('¿Borrar inventario y auditorías?')){localStorage.removeItem('hhProducts');localStorage.removeItem('hhAudits');toast('Datos borrados')}}
async function startScan(){
 if(!window.isSecureContext)return toast('Abre la app desde su dirección HTTPS');
 if(!navigator.mediaDevices?.getUserMedia)return toast('Chrome no permite la cámara aquí');
 if(!('BarcodeDetector' in window))return toast('Actualiza Chrome para usar escaneo en vivo');
 try{
  stopScan();
  const supported=await BarcodeDetector.getSupportedFormats();
  const wanted=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code'].filter(x=>supported.includes(x));
  detector=new BarcodeDetector({formats:wanted});
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
  $('video').srcObject=stream; await $('video').play(); scanning=true;
  $('scanLine').style.display='block'; $('liveStatus').textContent='Cámara activa · apunta al código'; $('scanBtn').textContent='Escaneando…';
  scanLoop();
 }catch(e){let m=e.name==='NotAllowedError'?'Activa el permiso de cámara en Chrome':e.name==='NotFoundError'?'No se encontró cámara trasera':e.name==='NotReadableError'?'La cámara está ocupada por otra app':'No se pudo iniciar: '+e.name;toast(m);$('liveStatus').textContent=m}
}
async function scanLoop(){
 if(!scanning||!detector)return;
 try{
  const codes=await detector.detect($('video'));
  if(codes[0]){
   const code=codes[0].rawValue,now=Date.now();
   if(code!==lastCode||now-lastAt>2500){lastCode=code;lastAt=now;$('scanCode').value=code;navigator.vibrate?.([80,40,80]);lookup('scanCode');$('liveStatus').textContent='Detectado: '+code;toast('Código detectado')}
  }
 }catch(e){}
 scanTimer=requestAnimationFrame(scanLoop);
}
function stopScan(){scanning=false;if(scanTimer)cancelAnimationFrame(scanTimer);scanTimer=null;stream?.getTracks().forEach(t=>t.stop());stream=null;if($('video'))$('video').srcObject=null;if($('scanLine'))$('scanLine').style.display='none';if($('liveStatus'))$('liveStatus').textContent='Escáner detenido';if($('scanBtn'))$('scanBtn').textContent='Iniciar escaneo inmediato'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function js(s){return String(s).replace(/['\\]/g,'\\$&')}
function net(){let on=navigator.onLine;$('net').textContent=on?'● EN LÍNEA':'● OFFLINE';$('net').style.color=on?'var(--cyan)':'var(--orange)'}addEventListener('online',net);addEventListener('offline',net);net();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
